name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Forced red main (test switch)
        if: github.event_name == 'push' && vars.FORCE_RED_MAIN == '1'
        run: |
          echo "FORCE_RED_MAIN is 1: failing main on purpose to test Autopilot's revert."
          exit 1
